# The autofix engine: turns an investigated exception into a draft PR.
#
# Called from a host repository with `uses: <this repo>/.github/workflows/engine.yml@<full sha>`.
# Five jobs, each holding the least it needs:
#
#   resolve   no secrets            validates every input, resolves the target from the host's config
#   fetch     PR App key (read)     dedupes on the branch, tars the target's default branch with .git
#   evidence  Azure OIDC only       runs fixed engine-owned KQL, writes evidence.json
#   agent     Anthropic key only    runs Claude with file tools only, produces patch.diff + result.json
#   pr        PR App key (write)    checks the patch, pushes autofix/<hash>, opens a draft PR
#
# Every input is untrusted data. It reaches a step only through `env:`; no expression
# appears inside any `run:` (tests/test_workflow.py enforces this).

name: autofix-engine

on:
  workflow_call:
    inputs:
      target:
        description: A key in the host's autofix-targets.json
        type: string
        required: true
      problem_id:
        description: The telemetry problem id, raw
        type: string
        required: true
      window_start:
        description: ISO-8601 UTC start of the window, ending in Z
        type: string
        required: true
      window_end:
        description: ISO-8601 UTC end of the window, ending in Z
        type: string
        required: true
      finding:
        description: The caller's one-line finding (a hint, not instructions)
        type: string
        required: true
      brief:
        description: The caller's suspected cause and location (a hint, not instructions)
        type: string
        required: false
        default: ""
      dry_run:
        description: "true uploads the patch as an artifact and opens no PR"
        type: string
        required: false
        default: "true"
      azure_client_id:
        description: Client id of the host's Azure identity, federated to the host repo
        type: string
        required: true
      azure_tenant_id:
        type: string
        required: true
      azure_subscription_id:
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      PR_APP_CLIENT_ID:
        required: true
      PR_APP_PRIVATE_KEY:
        required: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repo: ${{ steps.resolve.outputs.repo }}
      owner: ${{ steps.resolve.outputs.owner }}
      name: ${{ steps.resolve.outputs.name }}
      allow: ${{ steps.resolve.outputs.allow }}
      workspace: ${{ steps.resolve.outputs.workspace }}
      branch: ${{ steps.resolve.outputs.branch }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Check out the host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: host
          persist-credentials: false
      - name: Check out the engine at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - name: Validate inputs and resolve the target
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PROBLEM_ID: ${{ inputs.problem_id }}
          INPUT_WINDOW_START: ${{ inputs.window_start }}
          INPUT_WINDOW_END: ${{ inputs.window_end }}
          INPUT_FINDING: ${{ inputs.finding }}
          INPUT_BRIEF: ${{ inputs.brief }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 engine/scripts/resolve.py host/autofix-targets.json
          echo "**target**: $INPUT_TARGET, dry_run=$INPUT_DRY_RUN" >> "$GITHUB_STEP_SUMMARY"

  fetch:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      branch_exists: ${{ steps.dedupe.outputs.exists }}
      base_sha: ${{ steps.snapshot.outputs.base_sha }}
      default_branch: ${{ steps.snapshot.outputs.default_branch }}
    steps:
      - name: Mint a read-only token for the target
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve.outputs.owner }}
          repositories: ${{ needs.resolve.outputs.name }}
          permission-contents: read
      - name: Stop if the branch already exists
        id: dedupe
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ needs.resolve.outputs.repo }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: |
          refs=$(gh api "repos/$REPO/git/matching-refs/heads/$BRANCH" --jq '.[].ref')
          if grep -qxF "refs/heads/$BRANCH" <<<"$refs"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "**fetch**: branch $BRANCH already exists on the target; stopping before any model spend" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the target's default branch
        if: steps.dedupe.outputs.exists == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          token: ${{ steps.app.outputs.token }}
          path: target
          persist-credentials: false
      - name: Snapshot the tree, including .git
        id: snapshot
        if: steps.dedupe.outputs.exists == 'false'
        run: |
          echo "base_sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "default_branch=$(git -C target rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
          # A tarball keeps dot-files and file modes, which a plain artifact upload drops.
          tar -C target -cf tree.tar .
      - name: Upload the tree
        if: steps.dedupe.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree
          path: tree.tar
          retention-days: 1
          if-no-files-found: error

  evidence:
    needs: [resolve, fetch]
    if: needs.fetch.outputs.branch_exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the engine at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}
      - name: Gather evidence with fixed KQL
        env:
          INPUT_PROBLEM_ID: ${{ inputs.problem_id }}
          INPUT_WINDOW_START: ${{ inputs.window_start }}
          INPUT_WINDOW_END: ${{ inputs.window_end }}
          EVIDENCE_WORKSPACE: ${{ needs.resolve.outputs.workspace }}
        run: python3 engine/scripts/evidence.py evidence.json
      - name: Upload the evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence
          path: evidence.json
          retention-days: 1
          if-no-files-found: error

  agent:
    needs: [resolve, fetch, evidence]
    if: needs.fetch.outputs.branch_exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    outputs:
      outcome: ${{ steps.collect.outputs.outcome }}
    steps:
      - name: Check out the engine at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - name: Download the tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tree
      - name: Download the evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence
      - name: Lay out the working tree
        env:
          INPUT_FINDING: ${{ inputs.finding }}
          INPUT_BRIEF: ${{ inputs.brief }}
          ALLOW: ${{ needs.resolve.outputs.allow }}
        run: |
          mkdir work
          tar -C work -xf tree.tar
          mkdir work/.autofix
          mv evidence.json work/.autofix/evidence.json
          python3 -c 'import json, os, sys
          json.dump({"finding": os.environ["INPUT_FINDING"], "brief": os.environ["INPUT_BRIEF"]}, open(sys.argv[1], "w"))
          json.dump(json.loads(os.environ["ALLOW"]), open(sys.argv[2], "w"))' work/.autofix/hints.json work/.autofix/allow.json
      - name: Install bubblewrap (required by CLAUDE_CODE_SUBPROCESS_ENV_SCRUB)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: engine/scripts/run_agent.sh work out
      - name: Collect the patch and result
        id: collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ needs.fetch.outputs.base_sha }}
        run: |
          python3 engine/scripts/collect.py work out "$BASE_SHA"
          echo "outcome=$(cat out/outcome)" >> "$GITHUB_OUTPUT"
      - name: Upload the patch and result
        # Also after a failed session, so the artifact carries the fixed reason. After a key-scan
        # refusal collect.py writes neither file, and this uploads nothing.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-result
          path: |
            out/patch.diff
            out/result.json
          retention-days: 1
          if-no-files-found: warn
      - name: Check the patch now, so a dry run shows whether it would be refused
        # The same check job pr runs again before any write token exists. No secret in this step.
        if: steps.collect.outputs.outcome == 'patch'
        env:
          ALLOW: ${{ needs.resolve.outputs.allow }}
        run: |
          mkdir base
          tar -C base -xf tree.tar
          python3 engine/scripts/check_patch.py out/patch.diff "$ALLOW" base

  pr:
    needs: [resolve, fetch, agent]
    if: needs.agent.outputs.outcome == 'patch' && needs.resolve.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the engine at the pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false
      - name: Download the tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tree
      - name: Download the patch and result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-result
          path: out
      - name: Check the patch (all or nothing)
        env:
          ALLOW: ${{ needs.resolve.outputs.allow }}
        run: |
          mkdir target
          tar -C target -xf tree.tar
          python3 engine/scripts/check_patch.py out/patch.diff "$ALLOW" target
      - name: Build the PR title and body
        env:
          INPUT_PROBLEM_ID: ${{ inputs.problem_id }}
          INPUT_WINDOW_START: ${{ inputs.window_start }}
          INPUT_WINDOW_END: ${{ inputs.window_end }}
        run: python3 engine/scripts/pr_body.py out/result.json out/title.txt out/body.md
      - name: Mint a write token for the target
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve.outputs.owner }}
          repositories: ${{ needs.resolve.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push the branch and open a draft PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ needs.resolve.outputs.repo }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          BASE_SHA: ${{ needs.fetch.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ needs.fetch.outputs.default_branch }}
        run: |
          refs=$(gh api "repos/$REPO/git/matching-refs/heads/$BRANCH" --jq '.[].ref')
          if grep -qxF "refs/heads/$BRANCH" <<<"$refs"; then
            echo "**pr**: refused, branch $BRANCH appeared on the target since fetch; not forcing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git -C target checkout --quiet -b "$BRANCH" "$BASE_SHA"
          git -C target apply --index ../out/patch.diff
          git -C target -c user.name="${APP_SLUG}[bot]" -c user.email="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit --quiet --no-verify -F ../out/title.txt
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # No force: a branch that exists is a refusal, never an overwrite.
          git -C target -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --quiet origin "HEAD:refs/heads/$BRANCH"
          url=$(gh pr create --repo "$REPO" --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "$(cat out/title.txt)" --body-file out/body.md)
          echo "**pr**: opened draft $url" >> "$GITHUB_STEP_SUMMARY"
